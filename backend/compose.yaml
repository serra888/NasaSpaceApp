services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbiton
      POSTGRES_USER: orbiton
      POSTGRES_PASSWORD: orbiton_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orbiton_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbiton -d orbiton"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  orbiton_postgres:
